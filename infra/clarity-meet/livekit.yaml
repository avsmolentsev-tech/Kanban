# LiveKit SFU, одноузловой режим.
#
# Redis не используется намеренно: он нужен для координации нескольких узлов,
# а у нас один. Меньше контейнер и меньше памяти на общей машине.
port: 7880

rtc:
  # Один мультиплексированный UDP-порт, а НЕ диапазон.
  # На диапазоне подписки отваливаются с таймаутом, когда в комнате много
  # ICE-пиров: каждый egress заходит в комнату как отдельный участник, и
  # звонок вдвоём с демонстрацией экрана — это уже до семи пиров.
  udp_port: 7882
  # Запасной путь, когда UDP у клиента закрыт корпоративным файрволом.
  tcp_port: 7881
  # Обязательно на сервере. Иначе SFU анонсирует внутренний адрес контейнера,
  # клиент пытается достучаться до 172.x и медиа не устанавливается.
  use_external_ip: true

logging:
  level: info
