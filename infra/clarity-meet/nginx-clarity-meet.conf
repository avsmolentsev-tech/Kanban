# Clarity Meet: сигналинг LiveKit и будущий фронтенд.
#
# Медиа сюда НЕ идёт — оно летит напрямую в SFU по UDP 7882, мимо nginx.
# Через этот прокси проходит только сигнальный WebSocket.

server {
    listen 80;
    server_name livekit.clarity-space.ru meet.clarity-space.ru;
    server_tokens off;

    # Продление сертификата Let's Encrypt должно работать без правки конфига.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / { return 301 https://$host$request_uri; }
}

# Сигналинг SFU.
server {
    # nginx 1.24 на этом сервере: http2 включается в listen, директива
    # `http2 on` появилась только в 1.25.1.
    listen 443 ssl http2;
    server_name livekit.clarity-space.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/clarity-meet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clarity-meet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # Без этих двух строк звонок «почти работает»: интерфейс поднимается,
        # камера включается, а участники друг друга не видят — сигнальный
        # WebSocket не апгрейдится и рвётся.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сигнальное соединение живёт всю встречу, поэтому таймауты длинные.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Фронтенд Meet. Появится на этапе 2 — пока честная заглушка.
server {
    # nginx 1.24 на этом сервере: http2 включается в listen, директива
    # `http2 on` появилась только в 1.25.1.
    listen 443 ssl http2;
    server_name meet.clarity-space.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/clarity-meet/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clarity-meet/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain; charset utf-8;
        return 503 "Clarity Meet: интерфейс в разработке. Медиа-стек уже работает.\n";
    }
}
