          description: "'true' — вернуть иерархию parent_id/children вместо плоского списка."
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [documents]
      summary: Создать документ
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
