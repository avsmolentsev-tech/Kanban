    get:
      tags: [documents]
      summary: Цепочка родителей документа (для хлебных крошек)
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /v1/documents/{id}/attachments:
    get:
      tags: [documents]
      summary: Вложения документа
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documents]
      summary: Загрузить вложение к документу (до 50MB)
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
              required: [file]
      responses:
        '201': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/documents/attachments/{attId}:
    delete:
      tags: [documents]
      summary: Удалить вложение документа
      parameters:
        - name: attId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/documents/attachments/file/{filename}:
    get:
      tags: [documents]
      summary: Скачать файл вложения (публично, без проверки владельца)
      description: |
        Публичный маршрут — зарегистрирован в `routes/index.ts` до
        `requireAuth` и до монтирования `documentsRouter`, поэтому именно он
        обрабатывает этот путь для GET (в `documentsRouter` есть одноимённый
        обработчик с проверкой владения документом, но Express matчит первый
        зарегистрированный маршрут — до него запрос не доходит). Модель
        безопасности — неугадываемое имя файла, не авторизация. Изображения
        отдаются inline, остальные типы — принудительно как вложение
        (`Content-Disposition: attachment`) с `X-Content-Type-Options: nosniff`.
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: файл на скачивание
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

