      summary: AI-чат с контекстом vault
      description: |
        Требует настроенный ключ модели — без него весь роутер отвечает 501
        (см. `checkLlm` в GET /health). Ограничен дневным лимитом сообщений
        (тариф free — 50/день, отвечает 429 при превышении).
      requestBody:
        required: true
        content:
          application/json:
            schema:
