  /v1/todoist/status:
    get:
      tags: [todoist]
      summary: Подключён ли Todoist у текущего пользователя
      description: |
        Роутер смонтирован в `routes/index.ts` до `requireAuth` (публично), но
        каждый обработчик сам требует bearer-токен через `getUserId(req)` —
        без него отвечает как неавторизованный запрос, а не 401 автоматически.
        Здесь конкретно: без токена просто возвращает `{ connected: false }`.
      responses:
        '200':
          description: '{ connected: boolean }'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseOk' }
  /v1/todoist/connect-token:
    post:
      tags: [todoist]
      summary: Подключить Todoist по личному API-токену (без OAuth)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string } }
              required: [token]
      responses:
        '200':
          description: '{ connected: true }'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/todoist/disconnect:
    post:
      tags: [todoist]
      summary: Отключить Todoist
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/todoist/projects:
    get:
      tags: [todoist]
      summary: Проекты Todoist подключённого аккаунта
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/todoist/mapping:
    get:
      tags: [todoist]
      summary: Маппинг проектов Clarity Space ↔ Todoist
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [todoist]
      summary: Задать маппинг проекта Clarity Space ↔ Todoist
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
