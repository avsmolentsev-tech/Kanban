    post:
      tags: [todoist]
      summary: Полная двусторонняя синхронизация (pull + push + авто-создание проектов)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/todoist/auth:
    get:
      tags: [todoist]
      summary: Редирект на OAuth Todoist (требует bearer, начинает флоу подключения)
      security: []
      responses:
        '302':
          description: редирект на todoist.com
        '400':
          description: TODOIST_CLIENT_ID не настроен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/todoist/callback:
    get:
      tags: [todoist]
      summary: OAuth callback Todoist (вызывается Todoist, не клиентом напрямую)
      description: Авторизуется подписанным state-параметром (JWT на 10 минут), а не заголовком Authorization.
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '200':
          description: HTML-страница "Todoist подключён"
          content:
            text/html:
              schema: { type: string }
        '400':
          description: код/state отсутствует или недействителен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseError' }

