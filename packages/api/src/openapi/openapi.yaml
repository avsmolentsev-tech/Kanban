    post:
      tags: [email-webhook]
      summary: Создать задачу из пересланного письма (Zapier/Make/n8n/прямой webhook)
      description: |
        Публичный маршрут — вместо bearer использует общий секрет
        (см. схему webhookSecret). Пользователь указывается явно —
        `?user_id=` / `body.user_id`, либо переменной окружения
        `WEBHOOK_DEFAULT_USER_ID`.
      security:
        - webhookSecret: []
      requestBody:
        content:
